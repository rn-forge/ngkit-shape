[project]
name = "ngkit-shape"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN", "D", "PLR2004", "S101"]

[tool.uv]
no-sources = true

[dependency-groups]
dev = [
    "actionlint-py",
    "import-linter",
    "pip-audit",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "taplo",
    "zizmor",
]
docs = [
    "mdformat>=1.0.0",
    "mdformat-gfm>=0.4",
    "mdformat-front-matters>=2.0.0",
    "mdformat-mkdocs>=5.3.0",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",
]
