# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
name: CI

# validate → ci-cloud or ci-local → sonar, package, docs → ci-ok.
#
# ci-cloud:  `nx affected` distributed over Nx Cloud agents (.nx/workflows/agents.yaml).
# ci-local:  the same on the runner, unless `USE_NX_CLOUD` is `true` or dispatch checks it.
#
# Every step goes through `task`; `kiln doctor`'s ci-entrypoint rule fails the
# build if a step invokes uv/mkdocs/pnpm/npx/nx/ng/kiln directly. kiln runs
# here only as the version `[kiln] ref` pins, read-only, through
# `task validate`: it checks the tree against the committed
# .rn-forge/kiln/state.json and never runs `kiln apply`.
#
# The repeated toolchain setup lives in .github/actions/setup, committed beside
# this file. Each job checks out first: GitHub can only run a local action from
# the checked-out tree. Every `uses:` is pinned to a commit SHA with the version
# in a trailing comment. Pins move in kiln (cicd/pins.toml), not here; Dependabot
# (.github/dependabot.yml, also generated) watches only the repository's own
# actions and its uv dependencies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      use-nx-cloud:
        description: 'Use Nx Cloud distributed CI (leave unchecked to validate on a GitHub runner)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI resolves the committed lock and never rewrites it. Without this a stale
  # uv.lock passes CI against a resolution nobody committed.
  UV_LOCKED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: task setup

      # The Nx projects are checked by ci-cloud or ci-local; this job runs the rest.
      - name: Validate
        run: task ci:validate
        env:
          KILN_DOCTOR_FULL: ${{ ((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.event_name == 'workflow_dispatch') && '1' || '' }}

  # Fails a pull request that adds a dependency with a known vulnerability, from
  # GitHub's dependency graph. Skipped on a push, which `ci-ok` treats as a pass.
  dependency-review:
    needs: validate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Distributes lint/test/build/e2e across Nx Cloud agents (.nx/workflows/agents.yaml) when USE_NX_CLOUD=true.
  # This job excludes playwright as they are managed by Nx Cloud agents
  ci-cloud:
    needs: validate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.use-nx-cloud) || (github.event_name != 'workflow_dispatch' && vars.USE_NX_CLOUD == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          start-ci-run: >-
            --distribute-on="${{ vars.NX_CLOUD_AGENTS || '3' }} linux-medium" --stop-agents-after="lint,test,build,e2e-ci"

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - run: task ci:affected -- lint test build e2e-ci

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always()

  # The default path: the pipeline on a GitHub runner, for a repository not on Nx Cloud.
  ci-local:
    needs: validate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.use-nx-cloud == false) || (github.event_name != 'workflow_dispatch' && vars.USE_NX_CLOUD != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Browsers are only needed when some project has an e2e target
      - name: Detect e2e projects
        id: e2e
        run: task ci:has-e2e >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.e2e.outputs.has-e2e == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: task ci:playwright
        if: steps.e2e.outputs.has-e2e == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      - run: task ci:playwright:deps
        if: steps.e2e.outputs.has-e2e == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'

      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - run: task ci:affected -- lint test build e2e

  # Scans one tree, so it runs after either path. Skipped for Dependabot and fork
  # pull requests: GitHub sandboxes both (no Actions secrets), so SONAR_TOKEN is
  # not available there; the next push to main still scans the merged code.
  sonar:
    needs: [validate, ci-cloud, ci-local]
    if: ${{ always() && github.actor != 'dependabot[bot]' && (needs.ci-cloud.result == 'success' || needs.ci-local.result == 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs full history, not a shallow clone
          persist-credentials: false

      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate coverage and discover the lcov reports
        id: coverage
        run: task ci:coverage >> "$GITHUB_OUTPUT"

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          # Without qualitygate.wait the job passes on submitting the analysis,
          # so a failed quality gate would never fail CI.
          args: >
            -Dsonar.javascript.lcov.reportPaths=${{ steps.coverage.outputs.reports }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Runs regardless of which path above executed - packaging isn't a
  # validation step, it just needs one of them to have succeeded first.
  package:
    needs: [validate, ci-cloud, ci-local]
    if: ${{ always() && (needs.ci-cloud.result == 'success' || needs.ci-local.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Plain `nx pack` (unlike the release path) never stamps workspace:*
      # peers to exact pins, so verify-dist checks the CI tarballs' manifests.
      - name: Pack and verify publishable tarballs
        run: task ci:package

      - name: Upload package tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarballs
          path: dist/tarballs/*.tgz
          retention-days: 14

  # Publishes the one Pages site from main after the checks pass: MkDocs, with
  # Compodoc and Storybook assembled under it. deploy-pages replaces the whole
  # site, so every deploy builds all three.
  docs:
    needs: [validate, ci-cloud, ci-local]
    if: ${{ always() && (needs.ci-cloud.result == 'success' || needs.ci-local.result == 'success') && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint rejects the $/ form
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the MkDocs site
        run: task docs:build

      - name: Build Compodoc and Storybook and assemble the site
        run: task ci:docs:site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .docs-site
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The only check branch protection requires. Job and matrix names change as
  # the repo grows; this one does not. A skipped job (the fork-guarded scan, the
  # docs deploy on a pull request) is not a failure.
  ci-ok:
    needs: [validate, dependency-review, ci-cloud, ci-local, sonar, package, docs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r 'to_entries[] | select(.value.result | IN("failure", "cancelled")) | .key' <<<"$NEEDS" | paste -sd, -)
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $bad"
            exit 1
          fi
          if ! jq -e '[.["ci-cloud"].result, .["ci-local"].result] | index("success")' <<<"$NEEDS" >/dev/null; then
            echo "::error::Neither ci-cloud nor ci-local succeeded"
            exit 1
          fi
