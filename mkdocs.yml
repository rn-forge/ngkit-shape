site_name: ngkit-shape
site_description: ngkit-shape — architecture, guides, and API reference.
docs_dir: docs
exclude_docs: "_*"
strict: true
theme:
  name: material
  # Each area is a tab with its own sidebar (kiln ADR-0013); an area's
  # index.md is the tab's page, so no area's pages stack on another's.
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
# The nav below is derived by `kiln docs-generate` from docs/_areas.yml and
# the tree — do not hand-edit between the markers; run `task docs:generate`
# after adding a page. `task lint` fails on a stale nav.
nav:
  # BEGIN derived nav
  - Home: index.md
  - Architecture:
    - architecture/index.md
    - Workspace: architecture/workspace.md
    - Configuration: architecture/configuration.md
    - Core: architecture/core.md
    - Resource screen: architecture/resource-screen.md
    - Release pipeline: architecture/release-pipeline.md
    - CI template: architecture/ci-template.md
  - Guides:
    - guides/index.md
    - ngkit — Agent Guide for Building Apps on `@rn-forge/ng` + `@rn-forge/ng-bootstrap`: guides/building-an-app.md
    - HTTP: guides/http.md
    - Developing ngkit: guides/development.md
  - Runbooks:
    - runbooks/index.md
    - Releasing: runbooks/releasing.md
    - Recovering from drift: runbooks/recovering-from-drift.md
  - Reference: reference/index.md
  - Releases: releases/index.md
  - Specs: specs/index.md
  - Decisions: adr/index.md
  # END derived nav
